services:
  mongo-test:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data/db
      - /data/configdb
